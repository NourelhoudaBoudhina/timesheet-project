version: '3.8'
services:
  db:
    image: mysql:5.7
    container_name: mysql-timesheet
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=timesheet
    ports:
      - "3306:3306"
    volumes:
      - timesheetvol:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: timesheet-nourelhoudaboudhina-2alinfo1:latest
    container_name: timesheet-app
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/timesheet?useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
volumes:
  timesheetvol:
