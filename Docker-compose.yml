version: '3.8'

services:

  mysqldb:
    image: mysql:5.7
    container_name: mysql-timesheet
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: timesheet
      MYSQL_USER: timesheetuser
      MYSQL_PASSWORD: timesheetpass
    ports:
      - "3307:3306"
    volumes:
      - timesheetvol:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: timesheet-nourelhoudaboudhina-2alinfo1
    container_name: timesheet-app
    ports:
      - "8082:8082"
    depends_on:
      mysqldb:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/timesheet?useSSL=false&allo>
      SPRING_DATASOURCE_USERNAME: timesheetuser
      SPRING_DATASOURCE_PASSWORD: timesheetpass

volumes:
  timesheetvol:
